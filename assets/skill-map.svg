<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Skill Map</title>
  <desc id="desc">Compact technical map for systems, networking, hardware, programming, and AI-adjacent architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="58" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700">Skill Map / Kompetenzkarte</text>
  <text x="72" y="86" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Systems, networking, hardware, and deterministic architecture / Systeme, Netzwerke, Hardware und deterministische Architektur.</text>
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <path d="M600 120 V292"/>
    <path d="M360 206 H840"/>
    <path d="M600 206 H600"/>
  </g>
  <g fill="url(#card)" stroke="#475569" stroke-width="1.5">
    <rect x="70" y="122" width="250" height="88" rx="18"/>
    <rect x="340" y="122" width="250" height="88" rx="18"/>
    <rect x="610" y="122" width="250" height="88" rx="18"/>
    <rect x="880" y="122" width="250" height="88" rx="18"/>
    <rect x="355" y="242" width="490" height="76" rx="18"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="106" y="174" font-size="18" font-weight="700">Systems / Systeme</text>

    <text x="376" y="174" font-size="18" font-weight="700">Networking / Netzwerke</text>

    <text x="646" y="174" font-size="18" font-weight="700">Hardware / Hardware</text>

    <text x="906" y="174" font-size="16" font-weight="700">Programming / Programmierung</text>

    <text x="487" y="272" font-size="18" font-weight="700">AI-adjacent architecture / KI-nahe Architektur</text>
    <text x="446" y="298" font-size="15">Deterministic systems · auditability · local-first thinking</text>
  </g>
  <circle cx="600" cy="206" r="10" fill="#38bdf8"/>
</svg>
