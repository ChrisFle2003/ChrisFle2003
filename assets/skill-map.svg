<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Skill Map</title>
  <desc id="desc">Compact technical map for systems, networking, hardware, programming, and AI-adjacent architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="58" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700">Skill Map / Kompetenzkarte</text>
  <text x="72" y="86" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Practical focus areas across systems, networking, hardware, programming, and architecture / Praktische Schwerpunkte in Systemen, Netzwerken, Hardware, Programmierung und Architektur.</text>
  <g stroke="#334155" stroke-width="2" stroke-linecap="round">
    <path d="M600 120 V292"/>
    <path d="M360 206 H840"/>
    <path d="M600 206 H600"/>
  </g>
  <g fill="url(#card)" stroke="#475569" stroke-width="1.5">
    <rect x="90" y="120" width="210" height="84" rx="18"/>
    <rect x="330" y="120" width="210" height="84" rx="18"/>
    <rect x="570" y="120" width="210" height="84" rx="18"/>
    <rect x="810" y="120" width="210" height="84" rx="18"/>
    <rect x="450" y="240" width="300" height="84" rx="18"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="126" y="157" font-size="20" font-weight="700">Systems / Systeme</text>
    <text x="126" y="184" font-size="13">Linux · Ubuntu · Debian · Docker · Proxmox / Linux · Ubuntu · Debian · Docker · Proxmox</text>

    <text x="366" y="157" font-size="20" font-weight="700">Networking / Netzwerke</text>
    <text x="366" y="184" font-size="13">TCP/IP · pfSense · OPNsense · Sophos · Firewalls / TCP/IP · pfSense · OPNsense · Sophos · Firewalls</text>

    <text x="609" y="157" font-size="20" font-weight="700">Hardware / Hardware</text>
    <text x="609" y="184" font-size="13">Server setup · PC building · 3D printing · CAD / Server-Setup · PC-Bau · 3D-Druck · CAD</text>

    <text x="850" y="157" font-size="20" font-weight="700">Programming / Programmierung</text>
    <text x="850" y="184" font-size="13">Python · C/C++ · JavaScript · Bash · PowerShell / Python · C/C++ · JavaScript · Bash · PowerShell</text>

    <text x="494" y="277" font-size="20" font-weight="700">AI-adjacent architecture</text>
    <text x="470" y="304" font-size="13">Deterministic systems · auditability · local-first thinking / Deterministische Systeme · Auditierbarkeit · local-first Denken</text>
  </g>
  <circle cx="600" cy="206" r="10" fill="#38bdf8"/>
</svg>
