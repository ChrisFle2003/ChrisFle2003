<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Bilingual Status Strip</title>
  <desc id="desc">A compact row of technical badges for IT support, Linux, Docker, Proxmox, and networking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="22" fill="url(#bg)"/>
  <path d="M70 40 H1130" stroke="url(#accent)" stroke-opacity="0.25"/>
  <g fill="url(#chip)" stroke="#334155" stroke-width="1.5">
    <rect x="60" y="46" width="198" height="58" rx="18"/>
    <rect x="276" y="46" width="184" height="58" rx="18"/>
    <rect x="478" y="46" width="184" height="58" rx="18"/>
    <rect x="680" y="46" width="196" height="58" rx="18"/>
    <rect x="894" y="46" width="246" height="58" rx="18"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">
    <text x="90" y="79">IT-Support / Support</text>
    <text x="322" y="79">Linux / Learning</text>
    <text x="514" y="79">Docker / Practical</text>
    <text x="706" y="79">Proxmox / Homelab</text>
    <text x="916" y="79">Networking / Basics</text>
  </g>
  <g fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">
    <text x="90" y="97">Helpdesk + support mindset</text>
    <text x="322" y="97">System learning</text>
    <text x="514" y="97">Container basics</text>
    <text x="706" y="97">Lab thinking</text>
    <text x="916" y="97">TCP/IP foundation</text>
  </g>
</svg>
