<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Christopher Flegel / Duzi Banner</title>
  <desc id="desc">Dark technical banner with the name, location, and systems focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1030" cy="80" r="120" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1080" cy="240" r="180" fill="#64748b" opacity="0.08"/>
  <path d="M80 246 H1120" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.55"/>
  <path d="M80 246 H340" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <text x="80" y="118" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="700">Christopher Flegel / Duzi</text>
  <text x="82" y="168" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">Wien, Österreich · Systeme · Hardware · Netzwerke · Deterministische KI-Ideen</text>
  <text x="82" y="194" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">Vienna, Austria · Systems · Hardware · Networking · Deterministic AI Ideas</text>
  <text x="82" y="228" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Praktisches Systemdenken, lokale Werkzeuge und kontrollierte Forschungskonzepte.</text>
  <text x="82" y="250" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Practical systems thinking, local tools, and controlled research concepts.</text>
  <g fill="#1f2937" opacity="0.9">
    <rect x="900" y="48" width="220" height="34" rx="17"/>
    <rect x="900" y="90" width="160" height="34" rx="17"/>
    <rect x="900" y="132" width="190" height="34" rx="17"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600">
    <text x="918" y="70">Linux</text>
    <text x="918" y="112">Docker</text>
    <text x="918" y="154">Proxmox</text>
  </g>
</svg>
