<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Project Map</title>
  <desc id="desc">Roadmap style map for tools, scripts, web projects, MCP repository reading, and BRUCE preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="58" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700">Project Map / Projektkarte</text>
  <text x="72" y="86" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Small practical tools, scripts, web projects, MCP helpers, and a long-term teaser / Kleine praktische Tools, Skripte, Webprojekte, MCP-Helfer und ein langfristiger Teaser.</text>
  <path d="M110 210 H1090" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 210 H310" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
    <circle cx="110" cy="210" r="14"/>
    <circle cx="310" cy="210" r="14"/>
    <circle cx="520" cy="210" r="14"/>
    <circle cx="750" cy="210" r="14"/>
    <circle cx="980" cy="210" r="14"/>
  </g>
  <g fill="#1f2937" stroke="#475569" stroke-width="1.5">
    <rect x="70" y="120" width="180" height="74" rx="16"/>
    <rect x="270" y="120" width="180" height="74" rx="16"/>
    <rect x="480" y="120" width="180" height="74" rx="16"/>
    <rect x="700" y="120" width="180" height="74" rx="16"/>
    <rect x="910" y="120" width="220" height="74" rx="16"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="95" y="151" font-size="17" font-weight="700">Tools / Werkzeuge</text>
    <text x="95" y="175" font-size="13">Cheat sheets, helpers / Cheat Sheets, Helfer</text>

    <text x="297" y="151" font-size="17" font-weight="700">Scripts / Skripte</text>
    <text x="297" y="175" font-size="13">Python, Bash, CMD / Python, Bash, CMD</text>

    <text x="494" y="151" font-size="17" font-weight="700">Web Projects / Webprojekte</text>
    <text x="508" y="175" font-size="13">PDF Color Changer / PDF Color Changer</text>

    <text x="723" y="151" font-size="17" font-weight="700">MCP / Repo Reader</text>
    <text x="723" y="175" font-size="13">Structured repository access / Strukturierter Repository-Zugriff</text>

    <text x="918" y="151" font-size="17" font-weight="700">BRUCE Preview / Vorschau</text>
    <text x="918" y="175" font-size="13">Long-term research concept / Langfristiges Forschungskonzept</text>
  </g>
  <text x="72" y="296" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Roadmap style view: small tools first, larger architecture later / Roadmap-Ansicht: zuerst kleine Tools, später größere Architektur.</text>
</svg>
