<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Project Map</title>
  <desc id="desc">Roadmap style map for tools, scripts, web projects, MCP repository reading, and BRUCE preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="58" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700">Project Map / Projektkarte</text>
  <text x="72" y="86" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Tools, scripts, web projects, MCP helpers, and a long-term teaser / Tools, Skripte, Webprojekte, MCP-Helfer und ein langfristiger Teaser.</text>
  <g fill="#1f2937" stroke="#475569" stroke-width="1.5">
    <rect x="60" y="122" width="330" height="78" rx="16"/>
    <rect x="435" y="122" width="330" height="78" rx="16"/>
    <rect x="810" y="122" width="330" height="78" rx="16"/>
    <rect x="60" y="230" width="520" height="78" rx="16"/>
    <rect x="620" y="230" width="520" height="78" rx="16"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="88" y="152" font-size="18" font-weight="700">Tools / Werkzeuge</text>
    <text x="88" y="178" font-size="15">Cheat sheets, helpers</text>

    <text x="463" y="152" font-size="18" font-weight="700">Scripts / Skripte</text>
    <text x="463" y="178" font-size="15">Python, Bash, CMD</text>

    <text x="838" y="152" font-size="18" font-weight="700">Web Projects / Webprojekte</text>
    <text x="838" y="178" font-size="15">PDF Color Changer</text>

    <text x="88" y="260" font-size="18" font-weight="700">MCP / Repo Reader</text>
    <text x="88" y="286" font-size="15">Structured repo access</text>

    <text x="648" y="260" font-size="18" font-weight="700">BRUCE Preview / Vorschau</text>
    <text x="648" y="286" font-size="15">Long-term research concept</text>
  </g>
  <text x="72" y="340" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Small tools first, larger architecture later / Zuerst kleine Tools, später größere Architektur.</text>
</svg>
