<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BRUCE Teaser</title>
  <desc id="desc">Abstract deterministic research concept with input, rules, trace, review, and output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="160" cy="290" r="140" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1040" cy="80" r="120" fill="#94a3b8" opacity="0.08"/>
  <text x="72" y="64" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="700">BRUCE / deterministic research concept / kontrolliertes Forschungskonzept</text>
  <text x="72" y="94" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Public view only: input, rules, trace, review, output / Öffentliche Ansicht: Input, Regeln, Trace, Review, Output.</text>
  <path d="M170 200 H1030" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <g fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="2">
    <rect x="70" y="160" width="130" height="80" rx="18"/>
    <rect x="280" y="160" width="130" height="80" rx="18"/>
    <rect x="490" y="160" width="130" height="80" rx="18"/>
    <rect x="700" y="160" width="130" height="80" rx="18"/>
    <rect x="910" y="160" width="130" height="80" rx="18"/>
  </g>
  <g fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="99" y="199">Input</text>
    <text x="88" y="223">Eingang</text>
    <text x="297" y="199">Rules</text>
    <text x="291" y="223">Regeln</text>
    <text x="510" y="199">Trace</text>
    <text x="497" y="223">Nachverfolgung</text>
    <text x="710" y="199">Review</text>
    <text x="705" y="223">Prüfung</text>
    <text x="922" y="199">Output</text>
    <text x="921" y="223">Ausgabe</text>
  </g>
  <g fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">
    <text x="88" y="250">Observed data / Beobachtete Daten</text>
    <text x="282" y="250">Deterministic logic / Deterministische Logik</text>
    <text x="502" y="250">Visible steps / Sichtbare Schritte</text>
    <text x="706" y="250">Audit pass / Prüfungslauf</text>
    <text x="909" y="250">Controlled result / Kontrolliertes Ergebnis</text>
  </g>
  <text x="72" y="300" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Focus: auditability, local-first thinking, and LLMs as an explanation layer / Fokus: Auditierbarkeit, local-first Denken und LLMs als Erklärungs-Schicht.</text>
</svg>
